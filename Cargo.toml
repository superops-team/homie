[workspace]
members = [
    "crates/homie-agents",
    "crates/homie-app",
    "crates/homie-client",
    "crates/homie-cli",
    "crates/homie-context",
    "crates/homie-llm",
    "crates/homie-memory",
    "crates/homie-observability",
    "crates/homie-orchestrator",
    "crates/homie-proto",
    "crates/homie-remote",
    "crates/homie-runtime",
    "crates/homie-storage",
    "crates/homie-task",
    "crates/homie-term",
    "crates/homie-ui",
    "crates/homie-updater",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "dc2a339d5d043da448a3f7ddc7c0a85c63864aad" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "dc2a339d5d043da448a3f7ddc7c0a85c63864aad", features = ["font-kit"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
uuid = { version = "1", features = ["v7", "serde"] }

homie-proto = { path = "crates/homie-proto" }
homie-agents = { path = "crates/homie-agents" }
homie-client = { path = "crates/homie-client" }
homie-context = { path = "crates/homie-context" }
homie-llm = { path = "crates/homie-llm" }
homie-memory = { path = "crates/homie-memory" }
homie-observability = { path = "crates/homie-observability" }
homie-orchestrator = { path = "crates/homie-orchestrator" }
homie-remote = { path = "crates/homie-remote" }
homie-runtime = { path = "crates/homie-runtime" }
homie-storage = { path = "crates/homie-storage" }
homie-task = { path = "crates/homie-task" }
homie-term = { path = "crates/homie-term" }
homie-ui = { path = "crates/homie-ui" }
homie-updater = { path = "crates/homie-updater" }

[patch."https://github.com/zed-industries/zed.git"]
gpui_macos = { path = "vendor/gpui_macos" }
